site_name: Eldo Eletrostática
site_description: Documentação do projeto Eldo Eletrostática
repo_url: https://github.com/Eldo-Eletrostatica/Documentacao
repo_name: Eldo-Eletrostatica/Documentacao

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Stack: stack.md
  - Prototipação: prototipacao.md
  - Requisitos: historias_usuários.md
  - Modelo de dados: modelo-de-dados.md
  - Decisões (ADRs):
      - 0001 Chaves UUID e protocolo aleatório: adr/0001-chaves-uuid-e-protocolo-aleatorio.md
      - 0002 Exclusão lógica seletiva: adr/0002-exclusao-logica-seletiva.md
      - 0003 Preços e comissões congelados: adr/0003-precos-e-comissoes-congelados.md
      - 0004 Venda e OS no mesmo registro: adr/0004-venda-e-os-no-mesmo-registro.md
      - 0005 Modelo enxuto de 9 tabelas: adr/0005-modelo-enxuto-de-nove-tabelas.md
      - 0006 Armazenamento de arquivos: adr/0006-armazenamento-seaweedfs-e-r2.md
  - Processo:
      - Quadro Kanban: processo/quadro-kanban.md
      - Critérios de Aceite: processo/criterios-aceite.md
      - Como contribuir: processo/como-contribuir.md

exclude_docs: |
  agents/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
